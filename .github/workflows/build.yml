# Free cloud build (GitHub Actions).
#  - Push a version tag (e.g. v1.1.0) and the .exe / .dmg files are built and attached to a GitHub Release automatically.
#  - Or run it by hand from the Actions tab ("Build desktop apps" > Run workflow): the files come as downloadable artifacts only.
name: Build desktop apps
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed to attach files to a release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci || npm install
      - run: npm test
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with: { name: TaZ-IPTV-windows, path: "dist/*.exe" }
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true

  macos:   # untested - first run may need small tweaks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci || npm install
      - run: npm run dist:mac
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
      - uses: actions/upload-artifact@v4
        with: { name: TaZ-IPTV-mac, path: "dist/*.dmg" }
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
